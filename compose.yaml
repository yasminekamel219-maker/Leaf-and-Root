services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: leaf_and_root
      POSTGRES_USER: leaf_and_root
      POSTGRES_PASSWORD: leaf_and_root_local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leaf_and_root -d leaf_and_root"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - leaf_and_root_postgres:/var/lib/postgresql/data

volumes:
  leaf_and_root_postgres:
