name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - development

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts requires DATABASE_URL to load, but `prisma generate` and the unit tests
      # never connect to a database. A placeholder keeps this job database-free.
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  api-integration:
    name: API integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The harness derives the isolated database "leaf_and_root_test" from this URL,
      # creates it, and applies every committed migration (prisma migrate deploy).
      # It refuses non-local hosts and any name not ending in _test.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leaf_and_root
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir server prisma:generate
      - run: pnpm --dir server test:e2e
